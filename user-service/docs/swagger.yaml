basePath: /api/v1
definitions:
  request.CreateUser:
    properties:
      email:
        type: string
      password:
        type: string
      user_name:
        type: string
    type: object
  request.UpdateUser:
    properties:
      email:
        type: string
      password:
        type: string
      user_name:
        type: string
    type: object
  response.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      user_name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API Server for Users Application
  title: User App API
  version: "1.0"
paths:
  /users:
    get:
      consumes:
      - application/json
      description: Возвращает массив всех пользователей
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/response.User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Получить список всех пользователей
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Принимает JSON с данными и создает нового пользователя
      parameters:
      - description: Данные пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreateUser'
      produces:
      - application/json
      responses:
        "201":
          description: id пользователя
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "400":
          description: Invalid request body / Validation error
          schema:
            type: string
        "409":
          description: Email or Username already exists
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Создать нового пользователя
      tags:
      - users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Удаляет запись пользователя по его ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Успешно удалено
        "400":
          description: Invalid ID
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Удалить пользователя
      tags:
      - users
    get:
      consumes:
      - application/json
      description: Возвращает данные одного пользователя по его уникальному идентификатору
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.User'
        "400":
          description: Invalid user ID
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Получить пользователя по ID
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Обновляет профиль существующего пользователя по его ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Новые данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpdateUser'
      produces:
      - application/json
      responses:
        "204":
          description: Успешно обновлено, без тела ответа
        "400":
          description: Invalid ID / Invalid request body
          schema:
            type: string
        "409":
          description: Email or Username already exists
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Обновить данные пользователя
      tags:
      - users
swagger: "2.0"
